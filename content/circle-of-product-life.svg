<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6" fill="#2c3e50"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#2c3e50">The circle of product life</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" fill="#566573">Four lifecycle domains on the ring, the factory at the hub. Sunset feeds the next bet.</text>

  <!-- ring: centre (600,400), r=250. Clockwise: Incubation (top) -> Transformation (right) -> Core (bottom) -> Sunset (left) -> Incubation -->
  <path d="M 717 179 A 250 250 0 0 1 843 340" fill="none" stroke="#2c3e50" stroke-width="2.6" marker-end="url(#arr)"/>
  <path d="M 843 460 A 250 250 0 0 1 717 621" fill="none" stroke="#2c3e50" stroke-width="2.6" marker-end="url(#arr)"/>
  <path d="M 483 621 A 250 250 0 0 1 357 460" fill="none" stroke="#2c3e50" stroke-width="2.6" marker-end="url(#arr)"/>
  <path d="M 357 340 A 250 250 0 0 1 483 179" fill="none" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arr-green)"/>
  <text x="298" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">capacity, customers,</text>
  <text x="298" y="197" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">learnings</text>

  <!-- threshold annotations, decider style -->
  <text x="822" y="214" text-anchor="start" font-size="9" fill="#95a5a6" font-style="italic">signal lands, models clear the gate</text>
  <text x="822" y="600" text-anchor="start" font-size="9" fill="#95a5a6" font-style="italic">material revenue</text>
  <text x="378" y="600" text-anchor="end" font-size="9" fill="#95a5a6" font-style="italic">cost-to-serve crosses the threshold</text>

  <!-- kill switch: Incubation straight to Sunset -->
  <path d="M 490 202 L 468 346" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arr-red)"/>
  <text x="430" y="280" text-anchor="middle" font-size="9" font-weight="600" fill="#c0392b">killed bet</text>

  <!-- Incubation (top) -->
  <rect x="490" y="100" width="220" height="100" rx="8" fill="#3498db"/>
  <text x="600" y="134" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Incubation</text>
  <text x="600" y="158" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">finding fit</text>
  <text x="600" y="179" text-anchor="middle" font-size="12" fill="#fff" opacity="0.85">learning, leading indicators</text>

  <!-- Transformation (right) -->
  <rect x="730" y="350" width="240" height="100" rx="8" fill="#8e44ad"/>
  <text x="850" y="384" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Transformation</text>
  <text x="850" y="408" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">scaling to material revenue</text>
  <text x="850" y="429" text-anchor="middle" font-size="12" fill="#fff" opacity="0.85">growth, adoption</text>

  <!-- Core (bottom) -->
  <rect x="490" y="600" width="220" height="100" rx="8" fill="#27ae60"/>
  <text x="600" y="634" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Core</text>
  <text x="600" y="658" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">mature, cash-generating</text>
  <text x="600" y="679" text-anchor="middle" font-size="12" fill="#fff" opacity="0.85">margin, reliability</text>

  <!-- Sunset (left) -->
  <rect x="230" y="350" width="240" height="100" rx="8" fill="#e67e22"/>
  <text x="350" y="384" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Sunset</text>
  <text x="350" y="408" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">retiring</text>
  <text x="350" y="429" text-anchor="middle" font-size="12" fill="#fff" opacity="0.85">migration, cost-to-serve, run-off</text>

  <!-- Platform hub -->
  <circle cx="600" cy="400" r="92" fill="#2c3e50"/>
  <text x="600" y="382" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Factory</text>
  <text x="600" y="405" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">builds for three</text>
  <text x="600" y="425" text-anchor="middle" font-size="12" fill="#fff" opacity="0.85">flow, time to prototype,</text>
  <text x="600" y="442" text-anchor="middle" font-size="12" fill="#fff" opacity="0.85">sustained output</text>

  <!-- spokes: platform serves the ring -->
  <line x1="600" y1="308" x2="600" y2="202" stroke="#95a5a6" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="692" y1="400" x2="728" y2="400" stroke="#95a5a6" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="600" y1="492" x2="600" y2="598" stroke="#95a5a6" stroke-width="1.8" stroke-dasharray="4 4"/>
  <!-- harvest: sunset -> platform -->
  <line x1="472" y1="400" x2="500" y2="400" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arr-green)"/>

  <!-- legend, decider style -->
  <line x1="60" y1="722" x2="1140" y2="722" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="300" y1="744" x2="340" y2="744" stroke="#2c3e50" stroke-width="2.6" marker-end="url(#arr)"/>
  <text x="350" y="748" font-size="11" fill="#566573">explicit threshold</text>
  <line x1="520" y1="744" x2="560" y2="744" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arr-green)"/>
  <text x="570" y="748" font-size="11" fill="#566573">closes the loop</text>
  <line x1="720" y1="744" x2="760" y2="744" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arr-red)"/>
  <text x="770" y="748" font-size="11" fill="#566573">kill switch</text>
</svg>
